name: Build, Sign, and Deploy Release

on:
  push:
    tags:
      - "v*"

# CRITICAL: Define permissions needed for Sigstore OIDC keyless signing
permissions:
  id-token: write # Required to fetch the OIDC token from GitHub's provider
  contents: read # Required to read repository source
  packages: write # Required to publish and sign container images in GHCR

jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0 # Pins installer version safely

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Container Image
        id: meta
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          outputs: type=registry,rewrite-timestamp=true

      # Keyless signing via GitHub Actions OIDC identity token provider
      - name: Sign the Published Container Image
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign sign --yes ghcr.io/${{ github.repository }}/backend:latest

  verify-and-deploy:
    needs: build-and-sign
    runs-on: ubuntu-latest
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      # Strict verification gate: Validates transparency log integrity
      # and ensures the OIDC issuer matches this exact workflow identity.
      - name: Verify Image Signature before Deployment Promotion
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${{ github.repository_owner }}/*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            ghcr.io/${{ github.repository }}/backend:latest

      - name: Run Pact can-i-deploy gate
        env:
          PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          npm install --legacy-peer-deps
          npm run pact:can-i-deploy
